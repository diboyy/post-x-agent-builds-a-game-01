<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Catcher — one prompt, one game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0b1026; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Verdana, sans-serif; }
  canvas { display: block; background: linear-gradient(#141b4a, #0b1026); border-radius: 12px; box-shadow: 0 0 60px rgba(90, 120, 255, .35); }
</style>
</head>
<body>
<canvas id="game" width="720" height="480"></canvas>
<script>
"use strict";

// Star Catcher: catch the falling stars, dodge the rocks.
// Move with the mouse, the arrow keys, or tap / click. One prompt built this.

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// Best score survives a reload: the game-over screen promises a "Best",
// so it is kept in localStorage (guarded: file:// or private mode may deny it).
const BEST_KEY = "starCatcherBest";
function loadBest() {
  try {
    const v = Number(localStorage.getItem(BEST_KEY));
    return Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;
  } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* best stays in-session */ }
}

const state = {
  mode: "start", // "start" | "playing" | "over"
  score: 0,
  lives: 3,
  best: loadBest(),
  time: 0,
  spawnIn: 0,
  shake: 0,
};

const player = { x: W / 2, y: H - 56, w: 96, h: 26, speed: 460, targetX: W / 2 };
let items = [];   // falling things: {x, y, vy, kind, r, rot, vr}
let sparks = [];  // catch burst particles: {x, y, vx, vy, life, color}

function reset() {
  state.score = 0;
  state.lives = 3;
  state.time = 0;
  state.spawnIn = 0.4;
  items = [];
  sparks = [];
  player.x = W / 2;
  player.targetX = W / 2;
}

function startGame() {
  reset();
  state.mode = "playing";
}

function spawnItem() {
  const star = Math.random() < 0.68;
  items.push({
    x: 30 + Math.random() * (W - 60),
    y: -24,
    vy: 150 + Math.random() * 90 + Math.min(160, state.time * 6),
    kind: star ? "star" : "rock",
    r: star ? 15 : 17,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 3,
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 160;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.55, color });
  }
}

function update(dt) {
  state.time += dt;
  state.spawnIn -= dt;
  const interval = Math.max(0.28, 0.85 - state.time * 0.012);
  if (state.spawnIn <= 0) { spawnItem(); state.spawnIn = interval; }

  // Player glides toward the pointer / keys.
  const dx = player.targetX - player.x;
  player.x += Math.max(-player.speed * dt, Math.min(player.speed * dt, dx));
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  for (const it of items) {
    it.y += it.vy * dt;
    it.rot += it.vr * dt;
  }

  // Catching: an item counts when it reaches the basket line.
  const basketTop = player.y - player.h / 2;
  items = items.filter((it) => {
    if (it.y + it.r < basketTop || it.y - it.r > player.y + player.h) return it.y < H + 40;
    if (Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.6) {
      if (it.kind === "star") {
        state.score += 10;
        burst(it.x, it.y, "#ffd94a", 14);
      } else {
        state.lives -= 1;
        state.shake = 0.35;
        burst(it.x, it.y, "#ff5d5d", 18);
        if (state.lives <= 0) {
          state.mode = "over";
          state.best = Math.max(state.best, state.score);
          saveBest(state.best);
        }
      }
      return false;
    }
    return it.y < H + 40;
  });

  sparks = sparks.filter((p) => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt;
    return p.life > 0;
  });
  if (state.shake > 0) state.shake -= dt;
}

function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawRock(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = "#8a93a8";
  ctx.strokeStyle = "#5c6376";
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const rad = r * (0.85 + 0.3 * Math.sin(i * 2.7));
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#3c4152";
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.35, r * 0.3, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = "#141b4a";
  ctx.fillRect(0, 0, W, H);
  // Twinkling backdrop stars, seeded by position so they stay put.
  for (let i = 0; i < 60; i++) {
    const x = (i * 137.5) % W, y = (i * 89.3) % (H * 0.7);
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(state.time * 1.4 + i));
    ctx.globalAlpha = tw * 0.8;
    ctx.fillStyle = "#cfe0ff";
    ctx.fillRect(x, y, 2.5, 2.5);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const bob = Math.sin(state.time * 4) * 2;
  ctx.save();
  ctx.translate(player.x, player.y + bob);
  // Basket.
  ctx.fillStyle = "#ff9f1c";
  ctx.beginPath();
  ctx.moveTo(-player.w / 2, -player.h / 2);
  ctx.lineTo(player.w / 2, -player.h / 2);
  ctx.lineTo(player.w / 2 - 12, player.h / 2);
  ctx.lineTo(-player.w / 2 + 12, player.h / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ffd166";
  ctx.fillRect(-player.w / 2, -player.h / 2 - 4, player.w, 6);
  // Little star on the basket.
  drawStar(0, 2, 9, state.time, "#fff3b0");
  ctx.restore();
}

function drawHud() {
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 30px 'Trebuchet MS', Verdana, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + state.score, 18, 42);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ff8fa3";
  let hearts = "";
  for (let i = 0; i < 3; i++) hearts += i < state.lives ? "♥ " : "♡ ";
  ctx.fillText(hearts, W - 18, 42);
  ctx.textAlign = "center";
}

function centerText(lines, y0, gap) {
  lines.forEach((line, i) => {
    ctx.fillText(line.text, W / 2, y0 + i * gap);
  });
}

function draw() {
  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  }
  drawBackground();

  for (const it of items) {
    if (it.kind === "star") drawStar(it.x, it.y, it.r, it.rot, "#ffd94a");
    else drawRock(it.x, it.y, it.r, it.rot);
  }
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life / 0.55);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state.mode === "playing") {
    drawPlayer();
    drawHud();
  } else if (state.mode === "start") {
    ctx.fillStyle = "rgba(11, 16, 38, 0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd94a";
    ctx.font = "bold 64px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("★ STAR CATCHER ★", W / 2, 150);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px 'Trebuchet MS', Verdana, sans-serif";
    centerText([
      { text: "Catch the stars. Dodge the rocks." },
      { text: "Move with your mouse, arrow keys, or a tap." },
      { text: "Three lives — how many stars can you catch?" },
    ], 215, 40);
    ctx.fillStyle = "#7cf29c";
    ctx.font = "bold 30px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("PRESS SPACE OR CLICK TO PLAY", W / 2, 380);
    ctx.fillStyle = "#9fb4ff";
    ctx.font = "20px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("Built from one prompt by an AI agent", W / 2, 430);
  } else {
    drawHud();
    ctx.fillStyle = "rgba(11, 16, 38, 0.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff5d5d";
    ctx.font = "bold 58px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("GAME OVER", W / 2, 180);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 34px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("You caught " + state.score + " points of stars", W / 2, 250);
    if (state.best > 0) {
      ctx.fillStyle = "#ffd94a";
      ctx.font = "bold 26px 'Trebuchet MS', Verdana, sans-serif";
      ctx.fillText("Best: " + state.best, W / 2, 300);
    }
    ctx.fillStyle = "#7cf29c";
    ctx.font = "bold 28px 'Trebuchet MS', Verdana, sans-serif";
    ctx.fillText("PRESS SPACE OR CLICK TO PLAY AGAIN", W / 2, 380);
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.mode === "playing") update(dt);
  else state.time += dt;
  draw();
  requestAnimationFrame(loop);
}

function pointerToX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return ((clientX - rect.left) / rect.width) * W;
}

canvas.addEventListener("pointermove", (e) => { player.targetX = pointerToX(e.clientX); });
canvas.addEventListener("pointerdown", (e) => {
  player.targetX = pointerToX(e.clientX);
  if (state.mode !== "playing") startGame();
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    if (state.mode !== "playing") startGame();
    e.preventDefault();
  }
  if (e.code === "ArrowLeft") player.targetX -= 46;
  if (e.code === "ArrowRight") player.targetX += 46;
});

draw();
requestAnimationFrame(loop);

// Tiny handle for automated testing / scripted play: lets a driver read the
// live state and steer the basket. The game itself never uses this.
window.__starCatcher = {
  state,
  player,
  items: () => items,
};
</script>
</body>
</html>
